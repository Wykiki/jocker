[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.5.0"
authors = ["wykiki@proton.me"]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://gitlab.com/wykiki/jocker"
rust-version = "1.86.0"
description = """
Run your monorepo binaries locally with ease !
"""

[workspace.dependencies]
jocker-lib = { path = "./crates/jocker-lib", version = "0.5.0" }

chrono = { version = "0.4.38", features = ["std"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
clap-verbosity-flag = "3.0.4"
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4.27"
once_cell = "1.20.2"
pueue-lib = { version = "0.29.0", features = ["client"] }
redb = "2.6.0"
regex = "1.11.1"
serde = { version = "1.0.215", features = ["rc"] }
serde_json = "1.0.133"
serde_yml = "0.0.12"
snap = "1.1.1"
schemars = "0.8.22"
tabled = "0.17.0"
tempfile = "3.19.1"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["full", "rt"] }
url = { version = "2.5.4", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "warn"
